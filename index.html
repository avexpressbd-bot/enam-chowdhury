<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body>
    <div id="root">
      <div style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; font-family: sans-serif; flex-direction: column; gap: 20px;">
        <div style="width: 40px; height: 40px; border: 4px solid #f1f5f9; border-top: 4px solid #ef4444; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <div style="font-weight: bold; color: #1e293b;">লোড করা হচ্ছে...</div>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
