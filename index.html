<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body>
    <div id="root">
      <div style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; font-family: sans-serif; flex-direction: column; gap: 24px; padding: 20px; text-align: center;">
        <div style="position: relative;">
          <div style="width: 64px; height: 64px; border: 4px solid #e2e8f0; border-top: 4px solid #ef4444; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="font-weight: 900; color: #0f172a; font-size: 20px; letter-spacing: -0.025em;">লোড হচ্ছে...</div>
          <div style="color: #64748b; font-size: 14px; font-weight: 500;">অনুগ্রহ করে অপেক্ষা করুন।</div>
        </div>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
